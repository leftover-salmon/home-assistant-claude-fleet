# /config/packages/claude_fleet.yaml
# Claude Code fleet: status sensors, plan usage, records, tokens, a status light,
# daily recap, cleanup every 5 min.
#
# Session sensors are created automatically over MQTT discovery by
# claude-ha-status.sh — every one carries the attribute `claude_session: true`.
#
# >>> Status light, optional: an AWTRIX pixel clock needs nothing here (see
# claude_fleet_awtrix.yaml). For a plain smart bulb, set STATUS LIGHT below
# (search for it) and reload automations; with none set it does nothing.

input_boolean:
  claude_lamp_enabled:
    name: Claude status light
    icon: mdi:lightbulb-on-outline

# When the daily recap arrives; change it on the dashboard's Setup tab. No `initial:`,
# because that would reset the user's choice at every restart. A new time input
# starts at midnight instead, which is useless for a recap (the day has just reset),
# so "Claude · recap time default" turns midnight into 6 PM at startup.
input_datetime:
  claude_recap_time:
    name: Claude recap time
    has_date: false
    has_time: true
    icon: mdi:clock-outline

template:
  # ======================================================= PLAN USAGE SOURCE
  # The ONLY place to edit for plan usage, and with Clawdmeter nothing to edit:
  # the four attributes of sensor.claude_plan_source below find their
  # Clawdmeter entities by name suffix, whatever the account is called. (With
  # several Clawdmeter accounts, the first one wins.) Any other integration that
  # reports Claude plan limits works too -- "Claude Usage" (hass-claude-usage),
  # claude-ha: replace each attribute with that integration's entity id in
  # quotes, e.g.  session_usage: "sensor.your_session_usage"
  # Session is the 5-hour pool, weekly the 7-day one; usage in %, resets as
  # timestamps. No integration? Leave it; the sensors stay unknown and the plan
  # cards hide themselves.
  #
  # The source's STATE is its health, because a plan integration that stops
  # (an expired sign-in, an API change) otherwise fails silently: the gauges keep
  # showing the last numbers as if they were current.
  #   ok           reported in the last 20 minutes (Clawdmeter reports every 5)
  #   stale        nothing reported for 20+ minutes
  #   unavailable  the integration says unavailable/unknown, often a sign-in
  #   none         no plan integration: fine, plan cards are simply hidden
  # "Reported" is HA's last_reported, which moves on every poll even when the
  # number does not; last_updated would call a quiet Sunday stale.
  #
  # Everything else plan-related (time to reset, burn rate, time to limit,
  # today's peak) is derived below from the four, not read from the
  # integration, so every install runs the same arithmetic whatever it uses.
  - sensor:
      - name: Claude plan source
        unique_id: claude_plan_source
        icon: mdi:source-branch-check
        # reads its own attributes, which lag one render; now() re-renders it
        # every minute, so right after a reload it says "none" for a minute.
        # `list + [none]` before `first`: an entity id whose entity has gone
        # (integration removed, entity renamed) expands to nothing, and `first` of
        # nothing RAISES under strict undefined, flooding the log instead of
        # saying "unavailable".
        # A source that goes unavailable is reported only once it has STAYED so
        # for 15 minutes (from its last_changed). One failed poll used to raise
        # the "sign in again" banner at once; Clawdmeter misses a poll now and
        # then and recovers by itself, so the banner mostly sent you checking a
        # sign-in that was fine. Until then this keeps saying what it said.
        state: >
          {%- set src = this.attributes.get('session_usage', '') if this is defined and this.attributes is defined else '' %}
          {%- set st = (expand(src) | list + [none]) | first if src else none %}
          {%- set prev = this.state if this is defined else '' %}
          {%- if not src %}none
          {%- elif st is none %}unavailable
          {%- elif st.state in ['unknown', 'unavailable'] %}
          {%- if (as_timestamp(now()) - as_timestamp(st.last_changed)) > 900 %}unavailable
          {%- elif prev in ['ok', 'stale'] %}{{ prev }}
          {%- else %}ok{% endif %}
          {%- elif (as_timestamp(now()) - as_timestamp(st.last_reported)) > 1200 %}stale
          {%- else %}ok{% endif %}
        attributes:
          session_usage: >
            {{ (integration_entities('clawdmeter') | select('match', '^sensor\\..*_session_usage$') | list + ['']) | first }}
          session_reset: >
            {{ (integration_entities('clawdmeter') | select('match', '^sensor\\..*_session_reset$') | list + ['']) | first }}
          weekly_usage: >
            {{ (integration_entities('clawdmeter') | select('match', '^sensor\\..*_weekly_usage$') | list + ['']) | first }}
          weekly_reset: >
            {{ (integration_entities('clawdmeter') | select('match', '^sensor\\..*_weekly_reset$') | list + ['']) | first }}
          minutes_since_report: >
            {%- set src = this.attributes.get('session_usage', '') if this is defined and this.attributes is defined else '' %}
            {%- set st = (expand(src) | list + [none]) | first if src else none %}
            {{ (((as_timestamp(now()) - as_timestamp(st.last_reported)) / 60) | round(0) | int) if st is not none else none }}

  - sensor:
      - name: Claude plan session usage
        unique_id: claude_plan_session_usage
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:timer-sand
        # whole numbers stay whole: through | float alone, an integer feed
        # rendered as "19.0%" on the gauges
        state: >
          {%- set src = state_attr('sensor.claude_plan_source', 'session_usage') or '' %}
          {#- a source briefly unavailable keeps the last value, so the gauges
              don't vanish on one failed poll; past 15 minutes the plan source
              says unavailable, and its banner says these may be out of date -#}
          {%- set raw = states(src) if src else '' %}
          {%- if src and raw in ['unknown', 'unavailable'] and this is defined and this.state not in ['unknown', 'unavailable', ''] %}{{ this.state }}
          {%- else %}
          {%- set v = raw | float(none) if src else none %}
          {{ (v | int) if v is not none and v == (v | int) else v }}
          {%- endif %}
      - name: Claude plan session reset
        unique_id: claude_plan_session_reset
        device_class: timestamp
        state: >
          {%- set src = state_attr('sensor.claude_plan_source', 'session_reset') or '' %}
          {%- set raw = states(src) if src else '' %}
          {%- if src and raw in ['unknown', 'unavailable'] and this is defined and this.state not in ['unknown', 'unavailable', ''] %}{{ this.state }}
          {%- else %}{{ as_datetime(raw) if src else none }}{% endif %}
      - name: Claude plan weekly usage
        unique_id: claude_plan_weekly_usage
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:calendar-week
        state: >
          {%- set src = state_attr('sensor.claude_plan_source', 'weekly_usage') or '' %}
          {#- a source briefly unavailable keeps the last value, so the gauges
              don't vanish on one failed poll; past 15 minutes the plan source
              says unavailable, and its banner says these may be out of date -#}
          {%- set raw = states(src) if src else '' %}
          {%- if src and raw in ['unknown', 'unavailable'] and this is defined and this.state not in ['unknown', 'unavailable', ''] %}{{ this.state }}
          {%- else %}
          {%- set v = raw | float(none) if src else none %}
          {{ (v | int) if v is not none and v == (v | int) else v }}
          {%- endif %}
      - name: Claude plan weekly reset
        unique_id: claude_plan_weekly_reset
        device_class: timestamp
        state: >
          {%- set src = state_attr('sensor.claude_plan_source', 'weekly_reset') or '' %}
          {%- set raw = states(src) if src else '' %}
          {%- if src and raw in ['unknown', 'unavailable'] and this is defined and this.state not in ['unknown', 'unavailable', ''] %}{{ this.state }}
          {%- else %}{{ as_datetime(raw) if src else none }}{% endif %}
  # ==================================================== end of source block

  # ---- setup ---------------------------------------------------------------------
  # On while something REQUIRED is missing: no session has ever reported, or a
  # Mac is publishing from an older hook (a session that published in the last
  # 15 min without tokens_today). It shows the banner on the Sessions tab that
  # points to the Setup tab. Optional extras never turn it on.
  - binary_sensor:
      - name: Claude fleet setup needed
        unique_id: claude_fleet_setup_needed
        icon: mdi:list-status
        state: >
          {%- set ss = states.sensor | selectattr('attributes.claude_session', 'defined') | list %}
          {%- set ns = namespace(old=false) %}
          {%- for s in ss %}
          {%- set fresh = (as_timestamp(now()) - as_timestamp(s.attributes.get('last_seen'), 0)) < 900 %}
          {%- if fresh and 'tokens_today' not in s.attributes %}{% set ns.old = true %}{% endif %}
          {%- endfor %}
          {{ (ss | count == 0) or ns.old }}

  # ---- derived from the four above --------------------------------------------
  - sensor:
      - name: Claude plan session resets in
        unique_id: claude_plan_session_resets_in
        unit_of_measurement: min
        icon: mdi:timer-outline
        # now() in the template is what makes this re-render every minute
        state: >
          {%- set r = states('sensor.claude_plan_session_reset') %}
          {{ ([0, (as_timestamp(r) - as_timestamp(now())) / 60] | max) | round(1)
             if r not in ['unknown', 'unavailable', ''] else none }}

  # Burn rate, %/minute, over the last 30 minutes. A trigger-based sensor keeps
  # its own readings as an attribute (restored across restarts): one per
  # minute, newest last, older than 30 min dropped. The rate is
  # (newest - oldest) / minutes between them.
  #
  # A DROP in usage means the pool reset, and every reading before the drop
  # belongs to the old pool. They are discarded, so a fresh pool is never
  # charged with the last one's burn. A plain 30-minute derivative carries a
  # reset's negative jump for half an hour, and clamping that to zero only
  # hides it. Under 5 minutes of readings it reports unknown, not a guess.
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: sensor.claude_plan_session_usage
    sensor:
      - name: Claude plan usage rate
        unique_id: claude_plan_usage_rate
        unit_of_measurement: "%/min"
        state_class: measurement
        icon: mdi:fire
        # Recomputed when the SOURCE moves, and on the minute tick only once it has
        # been quiet for one poll (5 min + slack), so a stalled pool still decays.
        # Every minute, the rate drifted between the source's 5-minute updates and
        # "limit at" jumped by an hour with nothing new to say. The hold cannot be
        # longer than a poll: a poll that repeats the same value is no state change
        # in HA, so a 10-minute hold froze the rate at 0.52 while the source's own
        # had already fallen to 0.20.
        state: >
          {%- set tr = trigger | default(none) %}
          {%- set src = states.sensor.claude_plan_session_usage | default(none) %}
          {%- set quiet = (as_timestamp(now()) - as_timestamp(src.last_changed)) if src else 9999 %}
          {%- if tr is mapping and tr.get('platform') == 'time_pattern' and quiet < 330
                 and this.state not in ['unknown', 'unavailable', 'None', ''] %}{{ this.state }}
          {%- else %}
          {%- set u = states('sensor.claude_plan_session_usage') | float(none) %}
          {%- set t = as_timestamp(now()) | round(0) | int %}
          {%- set prev = this.attributes.get('readings', []) %}
          {%- set ns = namespace(k=[]) %}
          {%- for p in (prev if prev is iterable and prev is not string else []) %}
            {%- if p is sequence and p | count == 2 and t - (p[0] | int(0)) <= 1800 %}
              {%- set ns.k = [] if (u is not none and (p[1] | float(0)) > u) else ns.k %}
              {%- set ns.k = ns.k + ([p] if (u is none or (p[1] | float(0)) <= u) else []) %}
            {%- endif %}
          {%- endfor %}
          {%- if u is none or not ns.k %}{{ none }}
          {%- else %}
          {%- set span = (t - (ns.k[0][0] | int)) / 60 %}
          {{ ((u - (ns.k[0][1] | float)) / span) | round(4) if span >= 5 else none }}
          {%- endif %}
          {%- endif %}
        attributes:
          readings: >
            {%- set u = states('sensor.claude_plan_session_usage') | float(none) %}
            {%- set t = as_timestamp(now()) | round(0) | int %}
            {%- set prev = this.attributes.get('readings', []) %}
            {%- set ns = namespace(k=[]) %}
            {%- for p in (prev if prev is iterable and prev is not string else []) %}
              {%- if p is sequence and p | count == 2 and t - (p[0] | int(0)) <= 1800 %}
                {%- set ns.k = [] if (u is not none and (p[1] | float(0)) > u) else ns.k %}
                {%- set ns.k = ns.k + ([p] if (u is none or (p[1] | float(0)) <= u) else []) %}
              {%- endif %}
            {%- endfor %}
            {{ (ns.k + ([[t, u]] if u is not none else []))[-31:] }}

  - sensor:
      - name: Claude plan time to limit
        unique_id: claude_plan_time_to_limit
        unit_of_measurement: min
        icon: mdi:timer-alert-outline
        # rate 0 = no burn = the limit is not coming; a large finite number
        # rather than unknown, so "limit before reset?" still has an answer
        state: >
          {%- set u = states('sensor.claude_plan_session_usage') | float(none) %}
          {%- set r = states('sensor.claude_plan_usage_rate') | float(none) %}
          {%- if u is none or r is none %}{{ none }}
          {%- elif r <= 0 %}99999
          {%- else %}{{ ([0, (100 - u) / r] | max) | round(1) }}{% endif %}

  # Today's peak of the session pool, for the daily recap. Resets at midnight.
  - triggers:
      - trigger: state
        entity_id: sensor.claude_plan_session_usage
      - trigger: time
        at: "00:00:00"
    sensor:
      - name: Claude plan session peak today
        unique_id: claude_plan_session_peak_today
        unit_of_measurement: "%"
        icon: mdi:chart-bell-curve
        state: >
          {%- set today = now().strftime('%Y-%m-%d') %}
          {%- set prev = (this.state | float(0)) if this.attributes.get('day', '') == today else 0 %}
          {{ [prev, states('sensor.claude_plan_session_usage') | float(0)] | max }}
        attributes:
          day: "{{ now().strftime('%Y-%m-%d') }}"

  - sensor:
      - name: Claude fleet status
        unique_id: claude_fleet_status
        icon: mdi:robot-outline
        # worst state wins: needs_input > stale > working > idle > none
        # stale threshold comes from each session's stale_after_min attribute,
        # set per Mac via CLAUDE_HA_STALE_MINUTES (0 = never stale, for laptops)
        state: >
          {% set ns = namespace(needs=0, stale=0, working=0, idle=0) %}
          {% for s in states.sensor | selectattr('attributes.claude_session', 'defined') %}
            {% set age = as_timestamp(now()) - as_timestamp(s.attributes.last_seen, 0) %}
            {% set limit = (s.attributes.get('stale_after_min', 20) | int(20)) * 60 %}
            {% if s.state == 'needs_input' %}{% set ns.needs = ns.needs + 1 %}
            {% elif s.state == 'working' and limit > 0 and age > limit %}{% set ns.stale = ns.stale + 1 %}
            {% elif s.state == 'working' %}{% set ns.working = ns.working + 1 %}
            {% elif s.state == 'idle' %}{% set ns.idle = ns.idle + 1 %}
            {% endif %}
          {% endfor %}
          {{ 'needs_input' if ns.needs else 'stale' if ns.stale else 'working'
             if ns.working else 'idle' if ns.idle else 'none' }}
        attributes:
          needs_input: >
            {{ states.sensor | selectattr('attributes.claude_session', 'defined')
               | selectattr('state', 'eq', 'needs_input') | list | count }}
          working: >
            {{ states.sensor | selectattr('attributes.claude_session', 'defined')
               | selectattr('state', 'eq', 'working') | list | count }}
          idle: >
            {{ states.sensor | selectattr('attributes.claude_session', 'defined')
               | selectattr('state', 'eq', 'idle') | list | count }}
          waiting_on: >
            {{ states.sensor | selectattr('attributes.claude_session', 'defined')
               | selectattr('state', 'eq', 'needs_input')
               | map(attribute='attributes.label') | list }}

      # ---- counts for the "sessions over time" chart (numeric, so HA keeps history)
      # stale = working but silent past that Mac's stale_after_min; excluded from "working"
      - name: Claude sessions running
        unique_id: claude_sessions_running
        unit_of_measurement: sessions
        state_class: measurement
        icon: mdi:robot-outline
        state: >
          {{ states.sensor | selectattr('attributes.claude_session', 'defined')
             | selectattr('state', 'in', ['working', 'needs_input', 'idle']) | list | count }}
      - name: Claude sessions working
        unique_id: claude_sessions_working
        unit_of_measurement: sessions
        state_class: measurement
        icon: mdi:cog-outline
        state: >
          {% set ns = namespace(n=0) %}
          {% for s in states.sensor | selectattr('attributes.claude_session', 'defined') | selectattr('state', 'eq', 'working') %}
            {% set limit = (s.attributes.get('stale_after_min', 20) | int(20)) * 60 %}
            {% set age = as_timestamp(now()) - as_timestamp(s.attributes.last_seen, 0) %}
            {% if not (limit > 0 and age > limit) %}{% set ns.n = ns.n + 1 %}{% endif %}
          {% endfor %}
          {{ ns.n }}
      - name: Claude sessions stale
        unique_id: claude_sessions_stale
        unit_of_measurement: sessions
        state_class: measurement
        icon: mdi:timer-sand-empty
        state: >
          {% set ns = namespace(n=0) %}
          {% for s in states.sensor | selectattr('attributes.claude_session', 'defined') | selectattr('state', 'eq', 'working') %}
            {% set limit = (s.attributes.get('stale_after_min', 20) | int(20)) * 60 %}
            {% set age = as_timestamp(now()) - as_timestamp(s.attributes.last_seen, 0) %}
            {% if limit > 0 and age > limit %}{% set ns.n = ns.n + 1 %}{% endif %}
          {% endfor %}
          {{ ns.n }}
      - name: Claude sessions waiting
        unique_id: claude_sessions_waiting
        unit_of_measurement: sessions
        state_class: measurement
        icon: mdi:account-clock-outline
        state: >
          {{ states.sensor | selectattr('attributes.claude_session', 'defined')
             | selectattr('state', 'eq', 'needs_input') | list | count }}
      - name: Claude sessions idle
        unique_id: claude_sessions_idle
        unit_of_measurement: sessions
        state_class: measurement
        icon: mdi:sleep
        state: >
          {{ states.sensor | selectattr('attributes.claude_session', 'defined')
             | selectattr('state', 'eq', 'idle') | list | count }}

  - binary_sensor:
      - name: Claude anyone waiting
        unique_id: claude_anyone_waiting
        icon: mdi:account-clock
        state: "{{ states('sensor.claude_sessions_waiting') | int(0) > 0 }}"

  # Today's peak concurrency (and when it happened). Resets at midnight.
  - triggers:
      - trigger: state
        entity_id: sensor.claude_sessions_running
      - trigger: time
        at: "00:00:00"
    sensor:
      - name: Claude peak today
        unique_id: claude_peak_today
        unit_of_measurement: sessions
        icon: mdi:chart-bell-curve-cumulative
        state: >
          {% set today = now().strftime('%Y-%m-%d') %}
          {% set prev = (this.state | int(0)) if this.attributes.get('day', '') == today else 0 %}
          {% set cur = states('sensor.claude_sessions_running') | int(0) %}
          {{ [prev, cur] | max }}
        attributes:
          day: "{{ now().strftime('%Y-%m-%d') }}"
          at: >
            {% set today = now().strftime('%Y-%m-%d') %}
            {% set same = this.attributes.get('day', '') == today %}
            {% set prev = (this.state | int(0)) if same else 0 %}
            {% set cur = states('sensor.claude_sessions_running') | int(0) %}
            {{ now().strftime('%-I:%M %p') if (cur > prev or not same) and cur > 0
               else (this.attributes.get('at', '') if same else '') }}

  # share of today's session-time spent actually working (vs waiting / idle / stale)
  - sensor:
      - name: Claude working share today
        unique_id: claude_working_share_today
        unit_of_measurement: "%"
        icon: mdi:percent-outline
        state: >
          {% set run = states('sensor.claude_running_minutes_today') | float(0) %}
          {% set work = states('sensor.claude_working_minutes_today') | float(0) %}
          {{ (100 * work / run) | round(0) if run > 0 else 0 }}

  # minutes today with at least one session waiting on you: the time you cost
  # the fleet, which is what the KPI row shows (working share can't tell a
  # session waiting on you from one parked and finished)
  - sensor:
      - name: Claude waiting on you today
        unique_id: claude_waiting_on_you_today
        unit_of_measurement: min
        icon: mdi:account-clock
        state: "{{ (states('sensor.claude_waiting_time_today') | float(0) * 60) | round(0) | int }}"

  # Tokens spent today, every session (live + archived) and its subagents, as the
  # hook reads them from the transcripts. Cache hit = the share of input read
  # from the prompt cache, the cheapest tokens there are; a compaction throws
  # that cache away, so the two sit together.
  - sensor:
      - name: Claude tokens today
        unique_id: claude_tokens_today
        unit_of_measurement: tokens
        state_class: measurement
        icon: mdi:counter
        state: >
          {%- set today = now().strftime('%Y-%m-%d') %}
          {%- set live = states.sensor | selectattr('attributes.claude_session', 'defined')
               | selectattr('attributes.day', 'eq', today) | map(attribute='attributes') | list %}
          {%- set ids = live | map(attribute='session_id') | list %}
          {%- set arch = (state_attr('sensor.claude_archived_today', 'sessions') or [])
               if state_attr('sensor.claude_archived_today', 'day') == today else [] %}
          {%- set ns = namespace(t=0) %}
          {%- for s in live + (arch | rejectattr('session_id', 'in', ids) | list) %}
          {%- set k = s.get('tokens_today') if s.get('tokens_today') is mapping else {} %}
          {%- set ns.t = ns.t + (k.get('input', 0) | int(0)) + (k.get('output', 0) | int(0))
                         + (k.get('cache_read', 0) | int(0)) + (k.get('cache_write', 0) | int(0)) %}
          {%- endfor %}
          {{ ns.t }}
        attributes:
          breakdown: >
            {%- set today = now().strftime('%Y-%m-%d') %}
            {%- set live = states.sensor | selectattr('attributes.claude_session', 'defined')
                 | selectattr('attributes.day', 'eq', today) | map(attribute='attributes') | list %}
            {%- set ids = live | map(attribute='session_id') | list %}
            {%- set arch = (state_attr('sensor.claude_archived_today', 'sessions') or [])
                 if state_attr('sensor.claude_archived_today', 'day') == today else [] %}
            {%- set ns = namespace(i=0, o=0, r=0, w=0, c=0, ca=0, calls=0, bm={}) %}
            {%- for s in live + (arch | rejectattr('session_id', 'in', ids) | list) %}
            {%- set k = s.get('tokens_today') if s.get('tokens_today') is mapping else {} %}
            {%- set ns.i = ns.i + (k.get('input', 0) | int(0)) %}
            {%- set ns.o = ns.o + (k.get('output', 0) | int(0)) %}
            {%- set ns.r = ns.r + (k.get('cache_read', 0) | int(0)) %}
            {%- set ns.w = ns.w + (k.get('cache_write', 0) | int(0)) %}
            {%- set ns.calls = ns.calls + (k.get('calls', 0) | int(0)) %}
            {%- set ns.c = ns.c + (s.get('compactions_today', 0) | int(0)) %}
            {%- set ns.ca = ns.ca + (s.get('auto_compactions_today', 0) | int(0)) %}
            {#- per model, summed across sessions; a Mac on an older hook has no
                by_model and simply contributes nothing here -#}
            {%- set bm = k.get('by_model') if k.get('by_model') is mapping else {} %}
            {%- for m, v in bm.items() if v is mapping %}
            {%- set o = ns.bm.get(m, {}) %}
            {%- set vi = v.get('input', 0) | int(0) %}{% set vo = v.get('output', 0) | int(0) %}
            {%- set vr = v.get('cache_read', 0) | int(0) %}{% set vw = v.get('cache_write', 0) | int(0) %}
            {%- set ns.bm = dict(ns.bm, **{m: {
                  'total': o.get('total', 0) + vi + vo + vr + vw,
                  'input': o.get('input', 0) + vi, 'output': o.get('output', 0) + vo,
                  'cache_read': o.get('cache_read', 0) + vr, 'cache_write': o.get('cache_write', 0) + vw,
                  'calls': o.get('calls', 0) + (v.get('calls', 0) | int(0))}}) %}
            {%- endfor %}
            {%- endfor %}
            {%- set inn = ns.i + ns.r + ns.w %}
            {{ {'input': ns.i, 'output': ns.o, 'cache_read': ns.r, 'cache_write': ns.w,
                'calls': ns.calls, 'compactions': ns.c, 'auto_compactions': ns.ca,
